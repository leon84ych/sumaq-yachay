<div class="glossary-view">
  @if (isAddingEntry() || editingId() !== null) {
    <app-glossary-form [form]="this" />
  }
  @if (rows().length === 0) {
    <p class="empty-state">{{ 'COMMON.NO_ENTRIES' | transloco }}</p>
  } @else {
    <div class="glossary-toolbar">
      <label class="domain-search">
        <span class="visually-hidden">{{ 'DOMAINS.GLOSSARY.SEARCH' | transloco }}</span>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="8.75" cy="8.75" r="5.75" />
          <path d="m13 13 4 4" />
        </svg>
        <input
          type="search"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
          [placeholder]="'DOMAINS.GLOSSARY.SEARCH' | transloco"
        />
      </label>
    </div>

    @if (filteredRows().length === 0) {
      <p class="empty-state">{{ 'DOMAINS.GLOSSARY.NO_MATCHES' | transloco }}</p>
    } @else {
      <div class="glossary-grid">
        @for (row of filteredRows(); track row.id) {
          <app-glossary-entry-card
            [row]="row"
            [bookName]="bookName()"
            [bookAuthor]="bookAuthor()"
            [showContext]="true"
            (deleteRequested)="deleteEntry($event)"
            (editRequested)="editEntry($event)"
          />
        }
      </div>
    }
  }
</div>
