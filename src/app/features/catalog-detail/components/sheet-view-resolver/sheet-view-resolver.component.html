@switch (viewKind()) {
@case ('INDEX') {
<app-index [rows]="indexRows()" />
}
@case ('CONCEPTS') {
<app-concepts [rows]="conceptRows()" />
}
@case ('QUOTES') {
<app-quote-gallery [rows]="quoteRows()" />
}
@default {
<p class="unsupported-sheet">{{ 'CATALOG_DETAIL.UNSUPPORTED_SHEET' | transloco }}</p>
}
}
