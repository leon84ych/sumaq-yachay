@switch (viewKind()) {
@case ('INDEX') {
<app-index-view
  [currentSheet]="currentSheet()"
  [rows]="indexRows()"
  [isAddingEntry]="isAddingEntry()"
  (closeEntry)="closeEntry.emit()"
/>
}
@case ('CONCEPTS') {
<app-concepts
  [rows]="conceptRows()"
  [currentSheet]="currentSheet()"
  [isAddingEntry]="isAddingEntry()"
  (closeEntry)="closeEntry.emit()"
/>
}
@case ('QUOTES') {
<app-quote-gallery
  [rows]="quoteRows()"
  [currentSheet]="currentSheet()"
  [bookName]="bookName()"
  [bookAuthor]="bookAuthor()"
  [isAddingEntry]="isAddingEntry()"
  (closeEntry)="closeEntry.emit()"
/>
}
@case ('PASSAGES') {
<app-passages
  [rows]="passageRows()"
  [currentSheet]="currentSheet()"
  [bookName]="bookName()"
  [bookAuthor]="bookAuthor()"
  [isAddingEntry]="isAddingEntry()"
  (closeEntry)="closeEntry.emit()"
/>
}
@default {
<p class="unsupported-sheet">{{ 'CATALOG_DETAIL.UNSUPPORTED_SHEET' | transloco }}</p>
}
}
