<div class="detail-page">
  @if (domainDataService.isLoading()) {
    <p class="state-message">{{ 'CATALOG_DETAIL.LOADING' | transloco }}</p>
  } @else if (item(); as entry) {
    <div class="detail-header">
      <app-catalog-overview [item]="entry" />
      <div class="detail-actions">
        @if (activeSheetName()) {
          <button type="button" class="btn-primary" (click)="toggleAddingEntry()">
            + {{ 'DOMAINS.INDEX.ADD_ENTRY' | transloco }}
          </button>
        }
        @if (isAddingDomain()) {
          <div class="detail-domain-selector">
            <select
              #domainSelect
              class="domain-select"
              [disabled]="isCreatingDomain()"
              (change)="onDomainSelected(domainSelect.value)"
            >
              <option value="" disabled selected>
                {{ 'CATALOG_DETAIL.SELECT_DOMAIN' | transloco }}
              </option>
              @for (domain of availableDomains(); track domain) {
                <option [value]="domain">{{ 'DOMAINS.DOMAINS.' + domain | transloco }}</option>
              }
            </select>
            <button
              type="button"
              class="cancel-btn"
              [disabled]="isCreatingDomain()"
              [attr.aria-label]="'COMMON.CANCEL' | transloco"
              (click)="isAddingDomain.set(false)"
            >
              ×
            </button>
          </div>
        } @else {
          <button type="button" class="btn-primary" (click)="isAddingDomain.set(true)">
            + {{ 'CATALOG_DETAIL.DOMAIN' | transloco }}
          </button>
        }
      </div>
    </div>
    <app-catalog-sheet-tabs
      [sheetNames]="domainDataService.sheetNames()"
      [activeSheetName]="activeSheetName()"
      (selectTab)="selectTab($event)"
    />
    <app-sheet-view-resolver
      [sheet]="activeSheet()"
      [bookName]="item()?.name ?? ''"
      [bookAuthor]="item()?.author ?? ''"
      [isAddingEntry]="isAddingEntry()"
      (closeEntry)="isAddingEntry.set(false)"
    />
  } @else {
    <div class="not-found">
      <h2>{{ 'CATALOG_DETAIL.NOT_FOUND.TITLE' | transloco }}</h2>
      <p>{{ 'CATALOG_DETAIL.NOT_FOUND.DESC' | transloco }}</p>
    </div>
  }
</div>
