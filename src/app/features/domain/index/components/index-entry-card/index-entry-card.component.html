<article class="index-entry">
  <app-domain-entry-header
    domain="INDEX"
    [bookName]="bookName()"
    [bookAuthor]="bookAuthor()"
    [status]="row().syncStatus"
    [showContext]="showContext()"
    [retryable]="
      canRetry() &&
      showActions() &&
      permissions.validatePermission(role(), pendingDeletion() ? 'DELETE_ROW' : 'CREATE_ROW')
    "
    [retryLabelKey]="pendingDeletion() ? 'DOMAINS.INDEX.RETRY_DELETE' : 'COMMON.RETRY_SYNC'"
    (retryRequested)="retryRequested.emit(row())"
  />

  @if (pendingDeletion()) {
    <p class="index-entry__pending-delete" role="status">
      {{ 'DOMAINS.INDEX.DELETE_PENDING' | transloco }}
    </p>
  }
  <div class="index-entry__body">
    <div class="entry-heading">
      <strong>{{ row().subtheme || row().theme }}</strong>
      <div class="entry-tags" [attr.aria-label]="'DOMAINS.INDEX.TAGS' | transloco">
        @for (tag of splitTags(row().tags); track $index) {
          <button type="button" class="tag-badge" [appStudyTag]="tag">{{ tag }}</button>
        }
      </div>
      @if (showHierarchy()) {
        <span class="index-entry__hierarchy">
          {{ row().chapter }}
          @if (row().chapter && row().theme) {
            <span aria-hidden="true"> / </span>
          }
          {{ row().theme }}
        </span>
      }
    </div>
  </div>

  <app-domain-entry-footer
    [contributor]="row().contributor"
    [showDelete]="
      showActions() && !pendingDeletion() && permissions.validatePermission(role(), 'DELETE_ROW')
    "
    [showEdit]="
      showActions() && !pendingDeletion() && permissions.validatePermission(role(), 'CREATE_ROW')
    "
    (deleteRequested)="deleteRequested.emit(row().id)"
    (editRequested)="editRequested.emit(row())"
  />
</article>
