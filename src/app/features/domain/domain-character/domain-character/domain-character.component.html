<div class="characters-view">
  @if (isAddingEntry() || editingId() !== null) {
    <app-character-form [form]="this" />
  }
  @if (rows().length === 0) {
    <p class="empty-state">{{ 'COMMON.NO_ENTRIES' | transloco }}</p>
  } @else {
    <label class="domain-search">
      <span class="visually-hidden">{{ 'DOMAINS.CHARACTERS.SEARCH' | transloco }}</span>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="8.75" cy="8.75" r="5.75" />
        <path d="m13 13 4 4" />
      </svg>
      <input
        type="search"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        [placeholder]="'DOMAINS.CHARACTERS.SEARCH' | transloco"
      />
    </label>

    @if (filteredRows().length === 0) {
      <p class="empty-state">{{ 'DOMAINS.CHARACTERS.NO_MATCHES' | transloco }}</p>
    } @else {
      <div class="characters-grid">
        @for (row of filteredRows(); track row.id) {
          <app-character-entry-card
            [row]="row"
            [bookName]="bookName()"
            [bookAuthor]="bookAuthor()"
            [showActions]="true"
            [showContext]="true"
            (deleteRequested)="deleteEntry($event)"
            (editRequested)="editEntry($event)"
          />
        }
      </div>
    }
  }
</div>
