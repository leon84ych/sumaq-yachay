<section class="book-events-view">
  @if (isAddingEntry() || editingId() !== null) {
    <app-book-event-form [form]="this" />
  }
  @if (rows().length === 0) {
    <p class="empty-state">{{ 'COMMON.NO_ENTRIES' | transloco }}</p>
  } @else {
    <label class="domain-search">
      <span class="visually-hidden">{{ 'DOMAINS.BOOK_EVENTS.SEARCH' | transloco }}</span>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="8.75" cy="8.75" r="5.75" />
        <path d="m13 13 4 4" />
      </svg>
      <input
        type="search"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        [placeholder]="'DOMAINS.BOOK_EVENTS.SEARCH' | transloco"
      />
    </label>

    @if (filteredRows().length === 0) {
      <p class="empty-state">{{ 'DOMAINS.BOOK_EVENTS.NO_MATCHES' | transloco }}</p>
    } @else {
      <div class="book-events-grid">
        @for (event of filteredRows(); track event.id) {
          <app-book-event-entry-card
            [row]="event"
            [mainCharacterName]="characterName(event.mainCharacterId)"
            [secondaryCharacterNames]="secondaryCharacterNames(event.secondaryCharacterIds)"
            [placeName]="event.placeId ? placeName(event.placeId) : ''"
            [bookName]="bookName()"
            [bookAuthor]="bookAuthor()"
            [showContext]="true"
            (editRequested)="editEntry($event)"
            (deleteRequested)="deleteEntry($event)"
          />
        }
      </div>
    }
  }
</section>
