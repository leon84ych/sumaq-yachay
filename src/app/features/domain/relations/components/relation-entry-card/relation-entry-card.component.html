<app-domain-entry-card
  domain="RELATIONS"
  [title]="title()"
  [accentColor]="row().color || 'var(--border)'"
  [bookName]="bookName() || row().book"
  [bookAuthor]="bookAuthor() || row().author"
  [showContext]="true"
  [status]="row().syncStatus"
>
  <div class="relation-entry-card__content">
    <span class="relation-entry-card__type" [style.--relation-color]="row().color">
      {{ row().relationType }}
    </span>
    @if (row().directed) {
      <span class="relation-entry-card__direction">{{
        'DOMAINS.RELATIONS.DIRECTED' | transloco
      }}</span>
    }
    <p>{{ row().description }}</p>
    @if (row().page) {
      <p class="relation-entry-card__page">
        <strong>{{ 'DOMAINS.RELATIONS.PAGE' | transloco }}:</strong> {{ row().page }}
      </p>
    }
    @if (row().tags.length > 0) {
      <div
        class="relation-entry-card__tags"
        [attr.aria-label]="'DOMAINS.RELATIONS.TAGS' | transloco"
      >
        @for (tag of splitTags(row().tags); track tag) {
          <button type="button" [appStudyTag]="tag">{{ tag }}</button>
        }
      </div>
    }
  </div>

  <app-domain-entry-footer
    [contributor]="row().contributor"
    [showDelete]="showActions() && permissionService.validatePermission(role(), 'DELETE_ROW')"
    [showEdit]="showActions() && permissionService.validatePermission(role(), 'CREATE_ROW')"
    [exportData]="{
      id: row().id,
      domain: 'RELATIONS',
      bookName: bookName() || row()['book'],
      bookAuthor: bookAuthor() || row()['author'],
      title: title(),
      body: row().relationType + '\n\n' + row().description,
      tags: splitTags(row().tags),
      accentColor: row()['color'],
    }"
    (deleteRequested)="deleteRequested.emit(row().id)"
    (editRequested)="editRequested.emit(row())"
  />
</app-domain-entry-card>
