<div class="sheet-tabs-container" role="region" aria-label="Catalog Sheets Navigation">
  <div class="sheet-tabs" role="tablist">
    @for (name of domainNames(); track name) {
    <button type="button" class="tab-button" role="tab" [class.active]="name === activeDomainName()"
      [attr.aria-selected]="name === activeDomainName()" (click)="selectTab.emit(name)">
      {{ 'DOMAINS.DOMAINS.' + name | transloco }}
    </button>
    }
  </div>
</div>
