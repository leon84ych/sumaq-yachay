@if (loadingService.isLoading()) {
  <div
    class="global-loading-overlay"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    aria-busy="true"
  >
    <div class="global-loading-panel">
      <span class="global-loading-spinner" aria-hidden="true"></span>
      <span class="global-loading-message">{{ 'COMMON.LOADING' | transloco }}</span>
    </div>
  </div>
}
