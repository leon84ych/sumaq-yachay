<div class="app-layout">
  <app-global-loading />

  <!-- Global Top Navbar -->
  <header class="app-navbar">
    <div class="nav-container">
      <a routerLink="/catalog" class="nav-brand">
        <div class="brand-symbol">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-app-name">{{ 'NAV.BRAND_NAME' | transloco }}</span>
          <span class="brand-subtext">{{ 'NAV.BRAND_TAGLINE' | transloco }}</span>
        </div>
      </a>

      <div class="nav-right">
        <nav class="nav-links">
          <a routerLink="/catalog" routerLinkActive="active" class="nav-link"
            [attr.aria-label]="'NAV.CATALOG' | transloco">
            <svg class="nav-link-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" />
            </svg>
            <span class="nav-link-label">{{ 'NAV.CATALOG' | transloco }}</span>
          </a>
          <!-- Learn -->
          <a routerLink="/learn" routerLinkActive="active" class="nav-link" [attr.aria-label]="'NAV.LEARN' | transloco">
            <svg class="nav-link-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z" />
            </svg>
            <span class="nav-link-label">{{ 'NAV.LEARN' | transloco }}</span>
          </a>

          <!-- Quiz -->
          <a routerLink="/quiz" routerLinkActive="active" class="nav-link" [attr.aria-label]="'NAV.QUIZ' | transloco">
            <svg class="nav-link-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M6.267 3.455a.75.75 0 00-.708.522L3.547 10.22A2.25 2.25 0 005.695 13H13a2.25 2.25 0 002.245-1.92l1.153-6.73a.75.75 0 00-.98-.828l-3.13 1.157a.75.75 0 01-.636-.046l-4.14-2.31a.75.75 0 00-.245-.068zM4.75 14a.75.75 0 000 1.5h10.5a.75.75 0 000-1.5H4.75z"
                clip-rule="evenodd" />
            </svg>
            <span class="nav-link-label">{{ 'NAV.QUIZ' | transloco }}</span>
          </a>
        </nav>

        <app-login></app-login>
        <app-settings-panel ></app-settings-panel>
      </div>
    </div>

    @if (globalErrorService.message()) {
    <div class="global-error-banner" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="global-error-content">
        <svg class="global-error-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd" />
        </svg>
        <span class="global-error-message">{{ globalErrorService.message() }}</span>
      </div>
      <button type="button" class="global-error-close" aria-label="Dismiss error" (click)="globalErrorService.clear()">
        ✕
      </button>
    </div>
    }

  </header>

  <!-- Main View Router Outlet -->
  <main class="app-main">
    <router-outlet />
  </main>
</div>
