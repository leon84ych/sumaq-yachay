<div class="app-layout">
  <!-- Global Top Navbar -->
  <header class="app-navbar">
    <div class="nav-container">
      <a routerLink="/catalog" class="nav-brand">
        <div class="brand-symbol">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-app-name">{{ 'NAV.BRAND_NAME' | transloco }}</span>
          <span class="brand-subtext">{{ 'NAV.BRAND_TAGLINE' | transloco }}</span>
        </div>
      </a>

      <div class="nav-right">
        <nav class="nav-links">
          <a routerLink="/catalog" routerLinkActive="active" class="nav-link">
            <svg class="nav-link-icon" viewBox="0 0 20 20" fill="currentColor">
              <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" />
            </svg>
            <span>{{ 'NAV.CATALOG' | transloco }}</span>
          </a>
        </nav>

        <!-- Language Selector -->
        <div class="lang-switcher" role="group" aria-label="Language selector">
          <button
            type="button"
            class="lang-btn"
            [class.active]="getActiveLang() === 'en'"
            (click)="setLanguage('en')"
            title="English"
          >
            EN
          </button>
          <span class="lang-divider">/</span>
          <button
            type="button"
            class="lang-btn"
            [class.active]="getActiveLang() === 'es'"
            (click)="setLanguage('es')"
            title="Español"
          >
            ES
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Router Outlet -->
  <main class="app-main">
    <router-outlet />
  </main>
</div>
